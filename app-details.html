<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>App Details | Alamgir App Studio</title>
<style>
:root{--bg:#080d1b;--panel:#111a2e;--panel2:#17223a;--text:#f4f7ff;--muted:#aebbd2;--accent:#69e0c0;--line:#293752}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#172747 0,#080d1b 48%);color:var(--text);font-family:Arial,Helvetica,sans-serif;line-height:1.7}
a{color:inherit}.wrap{width:min(1050px,92%);margin:auto}.top{padding:22px 0;border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--accent);font-weight:700}
.hero{padding:48px 0 28px;display:flex;align-items:center;gap:26px}.logo{width:116px;height:116px;object-fit:cover;border-radius:26px;border:1px solid var(--line);box-shadow:0 12px 32px #0006}.eyebrow{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:12px}.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:8px 0}.subtitle{color:var(--muted);margin:0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.btn{display:inline-block;padding:11px 18px;border-radius:12px;text-decoration:none;font-weight:700;background:var(--accent);color:#07151a}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;margin:16px 0 46px}.card{background:linear-gradient(145deg,#121d32,#0f1729);border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:0 12px 35px #0002}.card h2{font-size:22px;margin:0 0 14px}.card p{color:#d8e1f0;margin:0 0 12px}.features{list-style:none;padding:0;margin:0;display:grid;gap:11px}.features li{padding:11px 13px;background:#17233a;border:1px solid #273653;border-radius:12px;color:#e8eef9}.features li:before{content:"✓";color:var(--accent);font-weight:bold;margin-right:10px}.note{color:var(--muted);font-size:13px;margin-top:16px}.not-found{text-align:center;padding:60px 20px}.footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);text-align:center;font-size:13px}
@media(max-width:720px){.hero{align-items:flex-start;gap:16px;padding-top:32px}.logo{width:82px;height:82px;border-radius:18px}.grid{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="./">← Back to Portfolio</a></div></header>
<main class="wrap" id="app"></main>
<footer class="footer"><div class="wrap">© <span id="year"></span> Alamgir App Studio · Android Apps</div></footer>

const params=new URLSearchParams(location.search);
const key=params.get("app") || "baby-memory-book";
const a=apps[key];
const root=document.getElementById("app");
document.getElementById("year").textContent=new Date().getFullYear();
if(!a){root.innerHTML='<section class="not-found"><h1>App not found</h1><p>Please return to the portfolio and select an app.</p><a class="btn" href="./">Back to Portfolio</a></section>';}

 root.innerHTML=`
 <section class="hero">

  <div><div class="eyebrow">Alamgir App Studio · ${a.category}</div><h1>${a.title}</h1><p class="subtitle">App overview, description and key features</p>

 </section>
 <section class="grid">
  <article class="card"><h2>About This App</h2><p>${a.about}</p><p>${a.note || ""}</p></article>

</body>
</html>
